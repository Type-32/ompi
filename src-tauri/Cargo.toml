[package]
name = "ompi"
version = "0.1.0"
description = "Desktop app for omp"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.82"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [ "config-json5" ] }

[dependencies]
serde_json = { version = "1.0", features = ["raw_value"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [ "devtools", "config-json5"] }
tauri-plugin-log = "2.9.2"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-os = "2.3.2"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-notification = "2.4.0"
tauri-plugin-store = "2.4.5"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt"] }
base64 = "0.22"
parking_lot = "0.12"

# Desktop-only (not compiled for iOS/Android)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-decorum = "1.1.1"
window-vibrancy = "0.8.1"
